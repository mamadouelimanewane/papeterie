<!doctype html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pas de connexion — Schoolmatik</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #1e293b; text-align: center; padding: 24px; }
  .card { max-width: 340px; }
  .icon { font-size: 56px; }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: #64748b; margin: 0 0 20px; }

</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Pas de connexion</h1>
    <p>Vérifiez votre réseau (Wi-Fi ou données mobiles), puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
